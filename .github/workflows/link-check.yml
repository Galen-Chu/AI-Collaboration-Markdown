name: link-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly — external links rot without repo changes

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          output: lychee-report.md
          args: >-
            --config .github/lychee.toml
            --no-progress
            --max-retries 2
            --retry-wait-time 5
            './**/*.md'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
